<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Zaman’s Aquarium</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#2a1240;--ink:#fff4fa;--mute:#f0c4de;--glass:rgba(70,26,86,.55);--line:rgba(255,205,232,.38);--aq:#ffb3d9;--font:'Fredoka',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
body{padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px))}
#stage{position:relative;height:100%;border-radius:22px;overflow:hidden;border:3px solid rgba(255,214,235,.6);box-shadow:0 0 0 1px rgba(0,0,0,.5),inset 0 0 60px rgba(0,0,0,.4),0 20px 60px rgba(0,0,0,.6)}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.g{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#top{position:absolute;top:12px;left:14px;right:12px;display:flex;align-items:center;gap:8px;pointer-events:none}
#ttl{flex:1;font-size:20px;font-weight:700;text-shadow:0 2px 12px rgba(0,0,0,.5)}
#tools{display:flex;gap:6px;pointer-events:auto}
button{font:inherit;color:var(--ink);cursor:pointer;border-radius:14px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#tools button{width:44px;height:44px;font-size:18px}
button:focus-visible{outline:2px solid var(--aq);outline-offset:2px}
button.on{border-color:var(--aq);box-shadow:0 0 16px rgba(255,160,210,.5)}
#dock{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:8px;border-radius:22px}
#dock button{min-width:66px;min-height:60px;padding:6px 8px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;position:relative;touch-action:none}
#dock b{font-size:24px;font-weight:400}
#dock button.on{background:rgba(255,160,210,.22)}
#fbar{position:absolute;left:10px;right:10px;bottom:3px;height:4px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden}
#fbar u{display:block;height:100%;background:#ffc86b;width:100%}
#panel{position:absolute;left:12px;right:12px;bottom:92px;border-radius:20px;padding:12px 12px 14px;display:none;max-height:46%;overflow-y:auto}
#panel.on{display:block;animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
#panel h3{font-size:13px;font-weight:600;color:var(--mute);margin:2px 4px 8px}
.cards{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.cards button{flex:0 0 auto;min-width:78px;min-height:78px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.cards button b{font-size:28px;font-weight:400}
.sw{min-width:44px!important;min-height:44px!important;width:44px;height:44px;border-radius:50%!important;padding:0!important}
#sel{position:absolute;top:66px;left:50%;transform:translateX(-50%);display:none;gap:6px;padding:6px;border-radius:18px;align-items:center;max-width:94%}
#sel.on{display:flex}#sel button{min-width:44px;min-height:44px;font-size:16px}
#sel input{font:inherit;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:12px;padding:0 10px;min-height:44px;width:130px}
#sel span{font-size:13px;padding:0 6px;color:var(--mute)}
#toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;background:var(--glass);border:1px solid var(--line)}
#toast.on{opacity:1}
#msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:26px;text-align:center;background:radial-gradient(circle at 50% 42%,rgba(255,236,210,.22),rgba(2,10,16,.95))}
#msg.on{display:flex}#msg div{max-width:440px;animation:rise 1.8s ease both}
#msg p{font-size:21px;line-height:1.55;margin:16px 0 24px;white-space:pre-wrap}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.96)}}
@media (prefers-reduced-motion:reduce){#msg div,#panel.on{animation:none}#load .hh{animation:none}}
#load{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 35%,#ffb7d5,#b58cf0 55%,#5a3fb0);transition:opacity .9s;text-align:center;padding:24px}
#load.off{opacity:0;pointer-events:none}
#load h1{font-size:clamp(28px,8vw,54px);font-weight:700;color:#fff;text-shadow:0 4px 24px rgba(120,40,120,.5);line-height:1.1}
#load .hh{font-size:46px;animation:beat 1.1s infinite}
@keyframes beat{50%{transform:scale(1.22)}}
#lbar{width:min(300px,70%);height:14px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden}
#lbar u{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#ff8fb8,#fff0c0);transition:width .2s}
#lt{color:#fff;font-size:16px}
#tip{position:absolute;transform:translate(-50%,-100%);padding:5px 13px;border-radius:999px;background:rgba(255,240,248,.94);color:#7a2a5a;font-size:14px;font-weight:600;pointer-events:none;opacity:0;transition:opacity .15s;white-space:nowrap;z-index:5;box-shadow:0 4px 14px rgba(120,40,100,.35)}#tip.on{opacity:1}
</style></head><body>

</div>

 ;c.stroke()}c.lineWidth=1.5;for(let r=30;r<90;r+=16){c.beginPath();c.arc(0,0,r,-2.2,-.94);c.stroke()}}},

anemone:{n:"Anemone",e:"🌸",s:.9,f:c=>{blob(c,22,24,"#c0508a","#6a2050");for(let i=0;i<15;i++){const a=-2.9+i*.2;const ex=Math.cos(a)*40+Math.sin(T*1.5+i)*6,ey=Math.sin(a)*52;c.strokeStyle="#ff9bd0";c.lineWidth=4;c.lineCap="round";c.beginPath();c.moveTo(Math.cos(a)*12,-10);c.quadraticCurveTo(ex*.5,ey*.4-10,ex,ey-6);c.stroke();c.fillStyle="#ffe4f2";c.beginPath();c.arc(ex,ey-6,3,0,7);c.fill()}}},

wood:{n:"Driftwood",e:"🪵",s:1.3,f:c=>{c.lineCap="round";c.strokeStyle="#6b4a30";c.lineWidth=17;c.beginPath();c.moveTo(-50,-4);c.bezierCurveTo(-40,-50,10,-20,48,-62);c.stroke();c.lineWidth=9;c.beginPath();c.moveTo(-6,-30);c.lineTo(-12,-68);c.moveTo(22,-44);c.lineTo(40,-26);c.stroke();c.strokeStyle="rgba(255,220,170,.25)";c.lineWidth=3;c.beginPath();c.moveTo(-48,-9);c.bezierCurveTo(-38,-54,10,-24,46,-66);c.stroke()}},

  if(sc.glow){ctx.fillStyle="rgba(130,255,230,.7)";for(let i=0;i<26;i++){const x=(i*137+Math.sin(t*.4+i)*40)%W,y=(i*83+t*7*(1+i%3))%sd;ctx.globalAlpha=.25+.4*Math.sin(t+i)**2;ctx.beginPath();ctx.arc(x,y,1.8,0,7);ctx.fill()}ctx.globalAlpha=1}}
 g=ctx.createLinearGradient(0,0,0,70);g.addColorStop(0,"rgba(235,255,252,.55)");g.addColorStop(1,"rgba(235,255,252,0)");ctx.fillStyle=g;ctx.fillRect(0,0,W,70);
 ctx.strokeStyle="rgba(255,255,255,.7)";ctx.lineWidth=2;ctx.beginPath();for(let x=0;x<=W;x+=10){const y=10+Math.sin(x*.02+t*1.4)*3+Math.sin(x*.055-t*2.1)*2;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();
 g=ctx.createRadialGradient(W/2,H*.5,Math.min(W,H)*.35,W/2,H*.5,Math.max(W,H)*.75);g.addColorStop(0,"rgba(60,10,70,0)");g.addColorStop(1,"rgba(60,10,70,.45)");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,"rgba(255,255,255,.16)");g.addColorStop(.06,"rgba(255,255,255,0)");g.addColorStop(.94,"rgba(255,255,255,0)");g.addColorStop(1,"rgba(255,255,255,.1)");ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}

// ---------- secret ----------
const shellOn=()=>S.fed>=15&&!S.found;const shellPos=()=>({x:W*.4,y:sandY()+H*.05});
function openMsg(){U("#msgT").textContent=CFG.msg;U("#msg").classList.add("on");if(!S.found){S.found=1;U("#bMsg").hidden=false;save()}tick(700)}
U("#msgX").onclick=()=>U("#msg").classList.remove("on");U("#bMsg").onclick=openMsg;

// ---------- input ----------
let ptr={x:-999,y:-999,sp:0,t:0},drag=null;
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener("pointerdown",e=>{const p=pos(e);ptr={x:p.x,y:p.y,sp:0,t:performance.now()};
 if(shellOn()){const s=shellPos();if(Math.hypot(p.x-s.x,p.y-s.y+8)<30)return openMsg()}
 let hit=null,hd=34;for(const f of fish){const d=Math.hypot(p.x-f.px,p.y-f.py);if(d<hd){hd=d;hit=f}}
 if(hit){sel={k:"f",id:hit.id};selUI();return}
 for(const d of S.decor.slice().sort((a,b)=>b.y-a.y)){const q=decBox(d);if(Math.abs(p.x-q.x)<q.u*.55&&p.y<q.y+10&&p.y>q.y-q.u*1.2){snap();sel={k:"d",id:d.id};drag={d,dx:q.x-p.x,dy:q.y-p.y};cv.setPointerCapture(e.pointerId);selUI();return}}
 if(sel){sel=null;selUI()}closePanel(false);
 if(S.food<3){toast("Out of food — hold the food button to refill");return}
 S.food-=3;S.fed++;fdraw();for(let i=0;i<5;i++)food.push({x:p.x+rnd(-18,18),y:Math.max(6,p.y)+rnd(0,10),v:rnd(22,38),ph:Math.random()*6,life:25});tick(rnd(500,800),.07);save();if(S.fed===15)toast("Something is glinting on the sand…")});
cv.addEventListener("pointermove",e=>{const p=pos(e),n=performance.now(),dt=(n-ptr.t)/1000||1;ptr.sp=Math.hypot(p.x-ptr.x,p.y-ptr.y)/dt;ptr.x=p.x;ptr.y=p.y;ptr.t=n;
 if(drag){drag.d.x=Math.min(.98,Math.max(.02,(p.x+drag.dx)/W));drag.d.y=Math.min(1,Math.max(.3,(p.y+drag.dy)/H))}});
cv.addEventListener("pointerup",()=>{if(drag){drag=null;save()}});cv.addEventListener("pointerleave",()=>{ptr.x=-999;ptr.sp=0});
addEventListener("keydown",e=>{if(e.key==="Escape"){sel=null;selUI();closePanel();U("#msg").classList.remove("on")}if((e.key==="Delete"||e.key==="Backspace")&&sel&&document.activeElement.tagName!=="INPUT")delSel()});

// ---------- UI ----------
const panel=U("#panel");let open=null;
function closePanel(){open=null;panel.classList.remove("on");document.querySelectorAll("#dock [data-p]").forEach(b=>b.classList.remove("on"))}
document.querySelectorAll("#dock [data-p]").forEach(b=>b.onclick=()=>{tick(520,.05);const k=b.dataset.p;if(open===k)return closePanel();open=k;panel.classList.add("on");document.querySelectorAll("#dock [data-p]").forEach(x=>x.classList.toggle("on",x===b));drawPanel()});
function cards(items,fn){return`<div class="cards">${items.map((o,i)=>`<button data-i="${i}" aria-label="${o.n}"${o.bg?` style="background:${o.bg};color:#4a2a00;border-color:#fff3b0"`:""}><b>${o.e}</b>${o.n}</button>`).join("")}</div>`}
function drawPanel(){if(open==="fish"){const ks=Object.keys(SP);panel.innerHTML=`<h3>Add a fish · ${fish.length} swimming · everything is free</h3>`+cards(ks.map(k=>SP[k]));panel.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>addFish(ks[b.dataset.i]))}
 if(open==="decor"){const ks=Object.keys(DEC);panel.innerHTML=`<h3>Tap to place, then drag it into position</h3>`+cards(ks.map(k=>DEC[k]));panel.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{snap();const d=mkDec(ks[b.dataset.i],rnd(.25,.75),.95,1);S.decor.push(d);sel={k:"d",id:d.id};selUI();save();tick(660);closePanel()})}
 if(open==="scene"){panel.innerHTML=`<h3>Scenery</h3>`+cards(SCN)+`<h3>Sand</h3><div class="cards">${SANDS.map((c,i)=>`<button class="sw ${i===S.sand?"on":""}" data-s="${i}" aria-label="Sand ${i+1}" style="background:${c}"></button>`).join("")}</div>`;
  panel.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{S.scene=+b.dataset.i;save();tick(500);toast(SCN[S.scene].n)});panel.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{S.sand=+b.dataset.s;save();drawPanel()})}}
function addFish(k){if(fish.length>=26)return toast("The tank is full");const r=Math.random()<.15,f=mkFish(k,r);S.fish.push(f);fish.push({...f,px:rnd(.2,.8)*W,py:H*.3,vx:0,vy:0,turn:1,tx:W/2,ty:H/2,wt:0,ph:0,full:1,eat:0,z:rnd(.55,1)});persist();drawPanel();tick(700);toast(r?"A rare "+SP[k].n+" appeared!":"Added "+SP[k].n)}
function delSel(){if(!sel)return;if(sel.k==="f"){fish=fish.filter(f=>f.id!==sel.id);persist()}else{snap();S.decor=S.decor.filter(d=>d.id!==sel.id);save()}sel=null;selUI();tick(380)}
function selUI(){const e=U("#sel");if(!sel){e.classList.remove("on");return}e.classList.add("on");
 if(sel.k==="f"){const f=fish.find(x=>x.id===sel.id);if(!f){sel=null;return selUI()}e.innerHTML=`<span>${SP[f.sp].n}${f.rare?" ✦ rare":""}</span><input id="nm" maxlength="18" placeholder="Name" aria-label="Fish name" value="${f.name.replace(/"/g,"&quot;")}"><button id="bDel" aria-label="Remove fish">🗑</button><button id="bOk" aria-label="Done">✓</button>`;U("#nm").onchange=ev=>{f.name=ev.target.value.trim();persist()}}
 else{const d=S.decor.find(x=>x.id===sel.id);if(!d){sel=null;return selUI()}e.innerHTML=`<span>${DEC[d.t].n}</span><button id="bMin" aria-label="Smaller">−</button><button id="bPlus" aria-label="Larger">+</button><button id="bFlip" aria-label="Flip">⇆</button><button id="bFr" aria-label="Bring to front or back">${d.front?"⬇":"⬆"}</button><button id="bDel" aria-label="Remove">🗑</button><button id="bOk" aria-label="Done">✓</button>`;
  U("#bMin").onclick=()=>{snap();d.s=Math.max(.4,d.s-.15);save()};U("#bPlus").onclick=()=>{snap();d.s=Math.min(2.6,d.s+.15);save()};U("#bFlip").onclick=()=>{snap();d.flip=!d.flip;save()};U("#bFr").onclick=()=>{snap();d.front=!d.front;save();selUI();toast(d.front?"In front of fish":"Behind fish")}}
 U("#bDel").onclick=delSel;U("#bOk").onclick=()=>{sel=null;selUI()}}
// food: hold to refill
let hold=0;const fb=U("#bFood");function fdraw(){U("#fbar u").style.width=Math.round(S.food)+"%"}
fb.addEventListener("pointerdown",e=>{e.preventDefault();hold=1;fb.classList.add("on");if(S.food>=100)toast("Food is full")});
const rel=()=>{if(hold){hold=0;fb.classList.remove("on");save()}};addEventListener("pointerup",rel);addEventListener("pointercancel",rel);
fb.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){S.food=100;fdraw();toast("Food refilled")}});
U("#bFx").onclick=()=>{S.low=S.low?0:1;U("#bFx").classList.toggle("on",!S.low);toast(S.low?"Low effects":"Full water effects");save()};
let ph=false;U("#bPh").onclick=()=>{ph=!ph;for(const s of["#top","#dock","#panel","#sel"])U(s).style.visibility=ph?"hidden":"";if(ph){closePanel();toast("Photo mode — tap 🖼 area top-right to exit");U("#top").style.visibility="visible";U("#ttl").style.visibility="hidden";for(const b of document.querySelectorAll("#tools button"))if(b.id!=="bPh")b.style.visibility="hidden"}else{U("#ttl").style.visibility="";for(const b of document.querySelectorAll("#tools button"))b.style.visibility=""}U("#bMsg").hidden=!S.found};
U("#bShot").onclick=()=>cv.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="my-aquarium.png";a.click();tick(900);toast("Photo saved")});

// ---------- loop ----------
let last=performance.now();
function frame(n){const dt=Math.min(.05,(n-last)/1000);last=n;t+=dt;T=t;if(hold&&S.food<100){S.food=Math.min(100,S.food+dt*45);fdraw();if(Math.random()<dt*14)tick(rnd(700,1200),.03)}
 update(dt);ctx.setTransform(DPR,0,0,DPR,0,0);frameDraw();requestAnimationFrame(frame)}
document.addEventListener("visibilitychange",()=>{if(document.hidden){persist()}else last=performance.now()});addEventListener("pagehide",persist);setInterval(persist,15000);
S.snd=S.snd?2:0;U("#ttl").textContent=CFG.name;U("#bMsg").hidden=!S.found;U("#bFx").classList.toggle("on",!S.low);U("#bSnd").textContent=["🔇","🔊","🔊"][S.snd];
{const L=U("#load"),bar=U("#lbar u"),lt=U("#lt"),ms=["Filling the tank…","Warming the water…","Scattering sparkles…","Waking up the fish…","Almost ready…"];let p=0,ready=false;
 const iv=setInterval(()=>{p=Math.min(100,p+rnd(4,9));bar.style.width=p+"%";lt.textContent=ms[Math.min(4,Math.floor(p/21))];if(p>=100){clearInterval(iv);ready=true;lt.textContent="Tap anywhere to dive in 💗";L.style.cursor="pointer"}},200);
 L.addEventListener("pointerdown",()=>{if(!ready)return;L.classList.add("off");if(S.snd)audioInit();setTimeout(()=>L.remove(),1000)})}
{const tip=U("#tip");const show=e=>{const p=pos(e);let hit=null,hd=34;for(const f of fish){const d=Math.hypot(p.x-f.px,p.y-f.py);if(d<hd){hd=d;hit=f}}if(hit){tip.textContent=(hit.name||SP[hit.sp].n)+(hit.rare?" ✦":"");tip.style.left=p.x+"px";tip.style.top=(p.y-34)+"px";tip.classList.add("on")}else tip.classList.remove("on")};cv.addEventListener("pointermove",show);cv.addEventListener("pointerdown",show);cv.addEventListener("pointerleave",()=>tip.classList.remove("on"))}
resize();mkCaustic();new ResizeObserver(resize).observe(U("#stage"));rebuild();fdraw();requestAnimationFrame(frame);
